<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fk_house</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- One card, shown next to the player's spot. The page stays transparent so
         the game is visible behind it (FiveM composites NUI over the game). -->
    <div id="card" class="card is-hidden" aria-live="polite">
        <div class="card__accent"></div>

        <header class="card__head">
            <p class="card__eyebrow" id="subtitle">Michael's house</p>
            <h1 class="card__title" id="title">Wardrobe</h1>
        </header>

        <ul class="options" id="options"></ul>

        <footer class="card__foot" id="footer">Press the number to choose · ESC to close</footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
