<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fk_economy — UI preview (dev only)</title>
    <link rel="stylesheet" href="../fk_economy/html/style.css" />
    <style>
        /* Fake in-game backdrop so the HUD/menu can be judged in context. */
        html.demo {
            background: #05080f;
        }

        html.demo::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(60% 45% at 22% 88%, rgba(59, 130, 246, 0.20), transparent 70%),
                radial-gradient(45% 40% at 78% 22%, rgba(14, 165, 233, 0.14), transparent 70%),
                radial-gradient(70% 60% at 50% 120%, rgba(30, 41, 59, 0.9), transparent 75%),
                linear-gradient(180deg, #0b1a2b 0%, #091320 45%, #05080f 100%);
        }

        html.demo::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.5;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(70% 70% at 50% 55%, #000 20%, transparent 75%);
        }

        .demo-note {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: 100;
            padding: 6px 12px;
            border-radius: 8px;
            font: 500 11px/1.4 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #93a4c0;
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <script>
        /* Dev-only harness: clone the real NUI markup, then run it with a mock
           Lua bridge (preview/demo.js) instead of the FiveM client. */
        (async function () {
            const load = (src) =>
                new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.body.appendChild(script);
                });

            try {
                const html = await fetch('../fk_economy/html/index.html').then((r) => r.text());
                const doc = new DOMParser().parseFromString(html, 'text/html');
                document.body.innerHTML = doc.body.innerHTML;

                document.documentElement.classList.add('demo');
                window.__FK_DEMO__ = true;

                const note = document.createElement('div');
                note.className = 'demo-note';
                note.textContent = 'Browser preview — mock data, no FiveM server attached';
                document.body.appendChild(note);

                await load('demo.js');
                await load('../fk_economy/html/app.js');
            } catch (error) {
                document.body.textContent = 'Preview failed to load: ' + error;
            }
        })();
    </script>
</body>
</html>
