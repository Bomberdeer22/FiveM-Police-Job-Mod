name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint every Lua file, then run all the checks
        run: |
          # preview.test.js loads the NUI page over HTTP, so the job needs the
          # same static server you use locally (npm run preview).
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8000/preview/ >/dev/null && break
            sleep 0.5
          done
          npm run check
